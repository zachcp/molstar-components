name: Test

on:
  push:
    paths:
      - "src/**"
      - "e2e/**"
      - "build.ts"
      - "playwright.config.ts"
      - "deno.json"
      - "deno.lock"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "build.ts"
      - "playwright.config.ts"
      - "deno.json"
      - "deno.lock"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test
        run: deno task test

  e2e:
    # Only on PRs and release tags — not on every ordinary push, since a full
    # run takes several minutes. (Deliberately not using a `tags:` filter on
    # the trigger above: GitHub's docs are self-contradictory about whether
    # `paths` is still evaluated for tag pushes when combined with `tags`, so
    # this is gated explicitly here instead, where it's unambiguous.)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Playwright browsers
        run: deno run --allow-all npm:playwright@1 install --with-deps chromium

      - name: Run e2e tests
        run: deno task test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
